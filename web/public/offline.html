<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0a;
        color: #ededed;
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card { max-width: 30rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; font-weight: 600; }
      p { margin: 0 0 1rem; color: #a1a1a1; }
      button {
        appearance: none;
        border: 1px solid #333;
        background: #171717;
        color: #ededed;
        border-radius: 999px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        min-height: 44px;
      }
      button:hover { border-color: #555; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <!-- This app runs on the user's own machine and is reached over a tunnel,
           so "offline" usually means that machine is asleep or off the network,
           not that a remote service is down. -->
      <p>career-ops runs on your own machine — check that it's awake and online, then try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
